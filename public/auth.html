<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VTT — Auth (dev)</title>
  <style>
    body { font-family: monospace; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    fieldset { margin-bottom: 16px; border: 1px solid #999; }
    legend { font-weight: bold; }
    label { display: block; margin: 6px 0 2px; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 14px; cursor: pointer; }
    #out { background: #111; color: #6f6; padding: 12px; white-space: pre-wrap;
           min-height: 60px; border-radius: 4px; }
    .row { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <h1>VTT auth (dev harness)</h1>

  <fieldset>
    <legend>Register</legend>
    <label>Email</label><input id="r-email" type="email" />
    <label>Username</label><input id="r-username" />
    <label>Password</label><input id="r-password" type="password" />
    <button id="r-submit">Register</button>
  </fieldset>

  <fieldset>
    <legend>Login</legend>
    <label>Email</label><input id="l-email" type="email" />
    <label>Password</label><input id="l-password" type="password" />
    <button id="l-submit">Login</button>
  </fieldset>

  <fieldset>
    <legend>Session</legend>
    <div class="row">
      <button id="me">Who am I? (/me)</button>
      <button id="logout">Logout</button>
    </div>
  </fieldset>

  <h3>Last response</h3>
  <div id="out">—</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
